<div class="main" *ngIf="usuarioLogado()">
  <h1>Maria Eduarda - 244061</h1>
  <h1>Gabriel Passos - 255751 </h1>
  
  <input class="lg-text-input" #campoNovoItem />
  <button class="btn-primary" (click)="CREATE_tarefa(campoNovoItem.value); campoNovoItem.value=''">
    Adicionar Tarefa
  </button>

  <ul>
    <li *ngFor="let tarefaDoLoop of arrayDeTarefas()">
      <app-item 
        [tarefa]="tarefaDoLoop" 
        (removeTarefa)="DELETE_tarefa(tarefaDoLoop)"
        (modificaTarefa)="UPDATE_tarefa($event)">
      </app-item>
    </li>
  </ul>
</div>

<div class="main" *ngIf="!usuarioLogado()">
    <h1>Login</h1>
    <input #username placeholder="nome" class="lg-text-input" />
    <br>
    <input #password type="password" placeholder="senha" class="lg-text-input" />
    <button class="btn-primary" (click)="login(username.value, password.value)">Login</button>
</div>
